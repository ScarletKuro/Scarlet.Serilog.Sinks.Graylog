# A real Graylog, for the tests marked Category=Integration.
#
# Everything below is scoped to a throwaway test instance: the credentials are fixed so the tests can
# authenticate without configuration, and the data stores keep no volumes so a run always starts from
# an empty index. Do not copy this as a deployment example.
#
#   docker compose -f tests/integration/docker-compose.yml up -d --wait
#   dotnet test tests/Scarlet.Serilog.Sinks.Graylog.Tests/Scarlet.Serilog.Sinks.Graylog.Tests.csproj \
#     -f net10.0 -- --filter-trait "Category=Integration"
#
# Pin one framework: the project multi-targets, and two runners against one server both create the
# inputs. That race is handled, but running it twice only makes the run slower.
#
#   docker compose -f tests/integration/docker-compose.yml down -v
services:
  mongodb:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      # Graylog manages its own indices and index templates.
      - action.auto_create_index=false
      # No TLS and no credentials between Graylog and its search backend. Both are needed: the entry
      # point runs the security demo installer unless the second one is set, and that installer refuses
      # to start without an admin password.
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 60

  graylog:
    image: graylog/graylog:6.1
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    entrypoint: /usr/bin/tini -- wait-for-it opensearch:9200 -- /docker-entrypoint.sh
    environment:
      # Test-only credentials. GRAYLOG_ROOT_PASSWORD_SHA2 is sha256("admin").
      - GRAYLOG_PASSWORD_SECRET=scarlet-serilog-sinks-graylog-integration
      - GRAYLOG_ROOT_PASSWORD_SHA2=8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      - GRAYLOG_HTTP_BIND_ADDRESS=0.0.0.0:9000
      - GRAYLOG_HTTP_EXTERNAL_URI=http://127.0.0.1:9000/
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
      # One second rather than the default minute: the tests search for a message they have just sent,
      # and every one of them would otherwise wait out the flush.
      - GRAYLOG_OUTPUT_BATCH_SIZE=1
      - GRAYLOG_OUTPUT_FLUSH_INTERVAL=1
    volumes:
      # The TLS test writes a freshly generated certificate here before it creates the input
      # that reads it, so no private key is ever committed. Read-only: only the test writes.
      - ./certs:/etc/graylog/certs:ro
    ports:
      - "127.0.0.1:9000:9000"
      # The inputs the test fixture creates: GELF over UDP, TCP, HTTP, then TCP with TLS.
      - "127.0.0.1:12201:12201/udp"
      - "127.0.0.1:12202:12202"
      - "127.0.0.1:12203:12203"
      - "127.0.0.1:12204:12204"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/lbstatus | grep -q ALIVE"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
