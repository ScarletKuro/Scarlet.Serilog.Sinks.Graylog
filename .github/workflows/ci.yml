name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  SOLUTION: scarlet-serilog-sinks-graylog.slnx

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 8.0.x/10.0.x provide the runtimes the test projects target. The 10.0.x
      # SDK also builds the library's net9.0 and .NET Framework targets via targeting
      # packs, and is new enough to read the .slnx solution format.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Scarlet.Serilog.Sinks.Graylog/Scarlet.Serilog.Sinks.Graylog.csproj \
            -c Release --no-restore -o artifacts --include-symbols -p:SymbolPackageFormat=snupkg

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-restore
          --results-directory TestResults --
          --filter-not-trait "Category=Integration"
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename "{asm}_{tfm}_{arch}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # Microsoft Code Coverage writes one Cobertura report per target framework; gather them before upload.
      - name: Collect coverage reports
        if: always()
        run: |
          mkdir -p coverage
          find . -name '*.cobertura.xml' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "coverage/$(basename "$(dirname "$f")").$(basename "$f")"
          done
          ls -l coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  aot:
    name: Native AOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The harness is net10.0 only, so it needs just the one SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ILC shells out to clang and links against zlib.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Analyzers cannot prove AOT compatibility on their own, and 'dotnet build -t:Publish' is not
      # equivalent to 'dotnet publish' - only a real publish runs ILC over the whole graph. The harness
      # sets TreatWarningsAsErrors, so any IL2xxx/IL3xxx from the sink or Serilog fails this job.
      - name: Publish and run (default)
        run: |
          dotnet publish tests/Scarlet.Serilog.Sinks.Graylog.AotHarness -c Release -r linux-x64
          ./tests/Scarlet.Serilog.Sinks.Graylog.AotHarness/bin/Release/net10.0/linux-x64/publish/Scarlet.Serilog.Sinks.Graylog.AotHarness

      # The strict run is the one that proves something: with reflection-based serialization switched off
      # the sink has to carry every value on its reflection-free path, so it cannot pass by accident on
      # reflection metadata that happened to survive trimming.
      - name: Publish and run (reflection-based serialization disabled)
        run: |
          dotnet publish tests/Scarlet.Serilog.Sinks.Graylog.AotHarness -c Release -r linux-x64 \
            -p:JsonSerializerIsReflectionEnabledByDefault=false
          ./tests/Scarlet.Serilog.Sinks.Graylog.AotHarness/bin/Release/net10.0/linux-x64/publish/Scarlet.Serilog.Sinks.Graylog.AotHarness
