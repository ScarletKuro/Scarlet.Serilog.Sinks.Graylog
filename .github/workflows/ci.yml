name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  SOLUTION: scarlet-serilog-sinks-graylog.slnx

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 8.0.x/10.0.x provide the runtimes the test projects target. The 10.0.x
      # SDK also builds the library's net9.0 and .NET Framework targets via targeting
      # packs, and is new enough to read the .slnx solution format.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Scarlet.Serilog.Sinks.Graylog/Scarlet.Serilog.Sinks.Graylog.csproj \
            -c Release --no-restore -o artifacts --include-symbols -p:SymbolPackageFormat=snupkg

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-restore
          --results-directory TestResults --
          --filter-not-trait "Category=Integration"
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename "{asm}_{tfm}_{arch}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # Microsoft Code Coverage writes one Cobertura report per test app and target framework, named with
      # a bare GUID, and leaves an identical copy of each under a per-machine working directory - only the
      # top level of TestResults holds the final reports. Each is renamed to contain "coverage" because the
      # Codecov CLI discovers reports by filename pattern and does not recognise "*.cobertura.xml".
      - name: Collect coverage reports
        if: always()
        run: |
          mkdir -p coverage
          i=0
          for f in TestResults/*.cobertura.xml; do
            [ -e "$f" ] || continue
            i=$((i + 1))
            cp "$f" "coverage/coverage-$i.cobertura.xml"
          done
          ls -l coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  integration:
    name: Graylog integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The test project targets net8.0 and net10.0; one framework is enough to prove Graylog accepts
      # what the sink sends, and these tests are slow enough not to want twice.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Not a service container: Graylog needs MongoDB and OpenSearch up and healthy before it will
      # start, and only compose can express that ordering. --wait blocks on the healthchecks, so the
      # tests never race the server coming up.
      - name: Start Graylog
        run: docker compose -f tests/integration/docker-compose.yml up -d --wait

      # The build job covers everything else, so a failure here is about Graylog and nothing else. The
      # fixture creates the GELF inputs itself; the step above is what guarantees there is a server for
      # it to create them on. Both guards are against a run that passes without testing anything:
      # GRAYLOG_REQUIRED turns the fixture's local-developer skip into a failure, and
      # --minimum-expected-tests catches a renamed trait leaving the filter matching nothing.
      - name: Test
        env:
          GRAYLOG_REQUIRED: 'true'
        run: >
          dotnet test tests/Scarlet.Serilog.Sinks.Graylog.Tests/Scarlet.Serilog.Sinks.Graylog.Tests.csproj
          -c Release -f net10.0 --
          --filter-trait "Category=Integration"
          --minimum-expected-tests 12

      - name: Graylog logs
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail 200 graylog

      - name: Stop Graylog
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v

  aot:
    name: Native AOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The AOT test project is net10.0 only, so it needs just the one SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # ILC shells out to clang and links against zlib.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Analyzers cannot prove AOT compatibility on their own, and 'dotnet build -t:Publish' is not
      # equivalent to 'dotnet publish' - only a real publish runs ILC over the whole graph. The project
      # sets TreatWarningsAsErrors, so any IL2xxx/IL3xxx from the sink or Serilog fails this job.
      # The same tests also run on a JIT runtime in the build job above; only this job proves AOT.
      # IncludeTestReportingExtensions=false keeps the coverage and TRX extensions - needed for the JIT
      # run, unsupported under ILC - out of the published graph. The published executable is a
      # Microsoft.Testing.Platform host, so it takes runner arguments directly and exits non-zero on
      # any failing test.
      - name: Publish and run (default)
        run: |
          dotnet publish tests/Scarlet.Serilog.Sinks.Graylog.Aot.Tests -c Release -r linux-x64 \
            -p:IncludeTestReportingExtensions=false
          ./tests/Scarlet.Serilog.Sinks.Graylog.Aot.Tests/bin/Release/net10.0/linux-x64/publish/Scarlet.Serilog.Sinks.Graylog.Aot.Tests

      # The strict run is the one that proves something: with reflection-based serialization switched off
      # the sink has to carry every value on its reflection-free path, so it cannot pass by accident on
      # reflection metadata that happened to survive trimming.
      - name: Publish and run (reflection-based serialization disabled)
        run: |
          dotnet publish tests/Scarlet.Serilog.Sinks.Graylog.Aot.Tests -c Release -r linux-x64 \
            -p:IncludeTestReportingExtensions=false \
            -p:JsonSerializerIsReflectionEnabledByDefault=false
          ./tests/Scarlet.Serilog.Sinks.Graylog.Aot.Tests/bin/Release/net10.0/linux-x64/publish/Scarlet.Serilog.Sinks.Graylog.Aot.Tests
