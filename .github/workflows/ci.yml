name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: scarlet-serilog-sinks-graylog.slnx

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 6.0.x/8.0.x/10.0.x provide the runtimes the test projects target. The 10.0.x
      # SDK also builds the library's net9.0 and .NET Framework targets via targeting
      # packs, and is new enough to read the .slnx solution format.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Scarlet.Serilog.Sinks.Graylog/Scarlet.Serilog.Sinks.Graylog.csproj \
            -c Release --no-restore -o artifacts --include-symbols -p:SymbolPackageFormat=snupkg

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-restore
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # Coverlet writes one Cobertura report per target framework. Both test projects
      # use the same file name, so gather them under project-qualified names before upload.
      - name: Collect coverage reports
        if: always()
        run: |
          mkdir -p coverage
          find tests -name 'coverage.cobertura.xml' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "coverage/$(basename "$(dirname "$f")").$(basename "$f")"
          done
          ls -l coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
