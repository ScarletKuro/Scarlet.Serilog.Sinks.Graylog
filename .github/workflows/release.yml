name: Release

on:
  push:
    tags:
      # Matches SemVer release tags: 1.0.0, 1.0.0-preview.1, 1.0.0-rc.1, etc.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  SOLUTION: scarlet-serilog-sinks-graylog.slnx

jobs:
  publish:
    name: Pack & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          set -euo pipefail

          version="$GITHUB_REF_NAME"

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a valid SemVer package version. Use 4.0.0 or 9.0.0-preview.2."
            exit 1
          fi

          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -p:Version=${{ steps.get_version.outputs.version }}

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-restore
          -p:Version=${{ steps.get_version.outputs.version }}
          --filter-not-trait "Category=Integration"

      - name: Pack
        run: |
          dotnet pack src/Scarlet.Serilog.Sinks.Graylog/Scarlet.Serilog.Sinks.Graylog.csproj \
            -c Release --no-restore -o artifacts/packages --include-symbols -p:SymbolPackageFormat=snupkg -p:Version=${{ steps.get_version.outputs.version }}

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: bash
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
